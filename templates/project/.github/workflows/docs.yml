# reviewdocs must be a devDependency committed in package.json and the lockfile.
# npm ci installs it. This workflow does not install the package on its own.
name: Documentation
on:
  pull_request:
  push:
    branches: [main]
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx reviewdocs check
