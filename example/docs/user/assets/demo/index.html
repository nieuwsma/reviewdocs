<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Note Desk synthetic demo</title><style>body{font:18px/1.6 system-ui;max-width:750px;margin:3rem auto;padding:1rem;color:#20262d}textarea{display:block;width:100%;min-height:8rem;font:inherit}button{padding:.6rem;margin:.4rem}section{background:#eef3f8;padding:1rem;border-radius:8px}#error{color:#9c2424}button:focus-visible,a:focus-visible,textarea:focus-visible{outline:3px solid #285f9d}</style></head><body><h1>Note Desk — synthetic demo</h1><p>Disposable browser-only example. No server or authentication.</p><label for="draft">Draft text</label><textarea id="draft"></textarea><button id="save">Save revision</button><button id="approve">Approve current</button><button id="reset">Reset demo</button><p id="error" role="alert"></p><section aria-label="Saved revision"><strong id="status"></strong><h2>Saved text</h2><p id="saved"></p></section><p><a href="../../index.html">User guide</a></p><script src="workflow.js"></script><script>
let workflow;const draft=document.querySelector('#draft'),error=document.querySelector('#error');try{workflow=new NoteWorkflow(JSON.parse(localStorage.getItem('note-desk'))||undefined);}catch{workflow=new NoteWorkflow();error.textContent='Storage unavailable; changes remain in memory.';}
function render(){document.querySelector('#saved').textContent=workflow.text;document.querySelector('#status').textContent=workflow.state.approvedVersion?'Approved version '+workflow.version:'Version '+workflow.version+' — Pending approval';document.querySelector('#approve').disabled=!workflow.version||draft.value!==workflow.text;}
function persist(){try{localStorage.setItem('note-desk',JSON.stringify(workflow.state));}catch{error.textContent='Storage failed; inspect saved state before retrying.';}}
draft.value=workflow.text;draft.addEventListener('input',render);document.querySelector('#save').addEventListener('click',()=>{error.textContent='';try{workflow.save(draft.value,workflow.version);persist();}catch(e){error.textContent=e.message;}render();});document.querySelector('#approve').addEventListener('click',()=>{error.textContent='';try{workflow.approve(workflow.version);persist();}catch(e){error.textContent=e.message;}render();});document.querySelector('#reset').addEventListener('click',()=>{workflow=new NoteWorkflow();draft.value='';error.textContent='';persist();render();});render();
</script></body></html>
